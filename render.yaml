databases:
  - name: ai-interview-db
    databaseName: ai_interview_prep
    user: ai_user
    plan: free

services:
  # ====================================================
  # Backend Web Service (Spring Boot 3 + Java 21)
  # ====================================================
  - type: web
    name: ai-interview-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-interview-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://*.onrender.com,https://*.render.com,http://localhost:5173,http://localhost:3000"
      - key: AI_PROVIDER
        value: mock
      - key: AI_API_KEY
        sync: false

  # ====================================================
  # Frontend Static Site (React 19 + Vite + Tailwind CSS)
  # ====================================================
  - type: web
    name: ai-interview-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ai-interview-backend
          envVarKey: RENDER_EXTERNAL_URL
